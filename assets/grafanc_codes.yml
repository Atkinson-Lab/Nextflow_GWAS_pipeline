# =============================================================================
# GRAF-ANC ANCESTRY CATEGORY REFERENCE
# =============================================================================
# Reference: https://github.com/jimmy-penn/grafanc
# GRAF-ANC infers ancestry into ~40 subpopulations organized into 8 major groups
# Use category NAMES directly (not numeric codes)
# =============================================================================

# -----------------------------------------------------------------------------
# MAJOR CONTINENTAL GROUPS (8 categories)
# -----------------------------------------------------------------------------
major_groups:
  AFR:
    name: "African"
    description: "Continental African ancestry"
    subpopulations:
      - West African (Yoruba, Esan, Gambian, Mende)
      - East African (Luhya, Maasai)
      - South African
    1000G_populations: ["YRI", "ESN", "GWD", "MSL", "LWK", "ACB", "ASW"]

  MEN:
    name: "Middle Eastern / North African"
    description: "Middle East and North African ancestry"
    subpopulations:
      - Middle Eastern (Bedouin, Palestinian, Druze)
      - North African (Mozabite, Egyptian)
    notes: "Sometimes called MENA in other tools"

  EUR:
    name: "European"
    description: "European continental ancestry"
    subpopulations:
      - Northern European (British, Finnish)
      - Southern European (Italian, Spanish)
      - Eastern European
      - Ashkenazi Jewish
    1000G_populations: ["CEU", "GBR", "FIN", "IBS", "TSI"]

  SAS:
    name: "South Asian"
    description: "Indian subcontinent ancestry"
    subpopulations:
      - Indian
      - Pakistani
      - Bangladeshi
      - Sri Lankan
    1000G_populations: ["GIH", "PJL", "BEB", "STU", "ITU"]

  EAS:
    name: "East Asian"
    description: "East and Southeast Asian ancestry"
    subpopulations:
      - Chinese (Han, Southern Chinese, Dai)
      - Japanese
      - Korean
      - Vietnamese
      - Southeast Asian
    1000G_populations: ["CHB", "CHS", "CDX", "JPT", "KHV"]

  AMR:
    name: "American / Indigenous"
    description: "Native American / Indigenous ancestry"
    subpopulations:
      - Native American
      - First Nations
      - Indigenous Mexican
      - Indigenous South American
    notes: "Pure indigenous ancestry (not admixed Latino)"
    1000G_populations: ["PEL (indigenous component)"]

  OCN:
    name: "Oceanian"
    description: "Pacific Islander and Australian ancestry"
    subpopulations:
      - Melanesian
      - Polynesian
      - Papuan
      - Aboriginal Australian
    notes: "Previously sometimes labeled as API (Asian/Pacific Islander) - OCN is correct"

  MIX:
    name: "Mixed / Admixed / Heterogeneous"
    description: "Individuals with heterogeneous or unclassified ancestry"
    notes: "Catchall for individuals not fitting other categories"

# -----------------------------------------------------------------------------
# ADMIXED GROUPS (for Tractor local ancestry analysis)
# -----------------------------------------------------------------------------
admixed_groups:
  AAC:
    name: "African American"
    description: "African American with AFR-EUR admixture"
    tractor_configuration:
      type: "2-way"
      ancestral_populations: ["AFR", "EUR"]
      expected_proportions:
        AFR: 0.75-0.85
        EUR: 0.15-0.25
    1000G_populations: ["ASW", "ACB"]
    notes: "Uses 2-way Tractor decomposition (African + European components)"

  LAT1:
    name: "Mexican / Central American Latino"
    description: "Latino with higher Native American component"
    tractor_configuration:
      type: "3-way"
      ancestral_populations: ["EUR", "AFR", "NAT"]
      expected_proportions:
        EUR: 0.40-0.60
        NAT: 0.30-0.50
        AFR: 0.05-0.15
    1000G_populations: ["MXL"]
    notes: "3-way Tractor (European + African + Native American)"

  LAT2:
    name: "Caribbean / South American Latino"
    description: "Latino with higher African component"
    tractor_configuration:
      type: "3-way"
      ancestral_populations: ["EUR", "AFR", "NAT"]
      expected_proportions:
        EUR: 0.50-0.70
        AFR: 0.15-0.30
        NAT: 0.10-0.25
    1000G_populations: ["PUR", "CLM", "PEL"]
    notes: "3-way Tractor (European + African + Native American)"

  LATINO:
    name: "Combined Latino"
    description: "LAT1 + LAT2 combined for analysis"
    combines: ["LAT1", "LAT2"]
    tractor_configuration:
      type: "3-way"
      ancestral_populations: ["EUR", "AFR", "NAT"]
    notes: "Combine LAT1 and LAT2 for better statistical power in Tractor"

# -----------------------------------------------------------------------------
# TRACTOR ANALYSIS CONFIGURATIONS
# -----------------------------------------------------------------------------
tractor_configs:
  # African American: 2-way admixture model
  AAC:
    n_ancestries: 2
    ancestral_pops: ["EUR", "AFR"]
    reference_panels:
      EUR: "1000G EUR populations (CEU, GBR, IBS, TSI, FIN)"
      AFR: "1000G AFR populations (YRI, ESN, GWD, MSL, LWK)"

  # Latino: 3-way admixture model
  LATINO:
    n_ancestries: 3
    ancestral_pops: ["EUR", "AFR", "NAT"]
    reference_panels:
      EUR: "1000G EUR populations"
      AFR: "1000G AFR populations"
      NAT: "Native American reference panel (requires separate sourcing)"
    notes: "Native American reference may require HGDP or specific Native panels"

# -----------------------------------------------------------------------------
# LOCAL ANCESTRY REFERENCE PANELS
# -----------------------------------------------------------------------------
local_ancestry_reference:
  EUR:
    source: "1000 Genomes"
    populations: ["CEU", "GBR", "IBS", "TSI", "FIN"]
    n_samples: ~500

  AFR:
    source: "1000 Genomes"
    populations: ["YRI", "ESN", "GWD", "MSL", "LWK"]
    n_samples: ~500

  NAT:
    source: "Custom panel required"
    options:
      - "HGDP Native American samples"
      - "Consortium-specific Native panels"
      - "Published reference panels (Moreno-Estrada et al.)"
    notes: "Native American reference is critical for accurate Latino analysis"

  EAS:
    source: "1000 Genomes"
    populations: ["CHB", "CHS", "CDX", "JPT", "KHV"]
    n_samples: ~500

  SAS:
    source: "1000 Genomes"
    populations: ["GIH", "PJL", "BEB", "STU", "ITU"]
    n_samples: ~500
