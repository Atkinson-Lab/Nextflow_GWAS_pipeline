# =============================================================================
# Curated QTL Datasets for Multi-Ancestry Colocalization Analysis
# =============================================================================
# This file defines QTL resources organized by ancestry/population
# Users can enable/disable specific datasets and add their own custom sources
#
# NOTE: GTEx is heavily European-biased. We include diverse sources to improve
# representation, particularly for African, Hispanic/Latino, and Asian ancestries.
# =============================================================================

# -----------------------------------------------------------------------------
# EUROPEAN-PREDOMINANT DATASETS
# These are large but limited in diversity
# -----------------------------------------------------------------------------
european_predominant:
  gtex_v8:
    name: "GTEx v8"
    description: "Genotype-Tissue Expression Project v8 (85% European)"
    types: [eqtl, sqtl]
    tissues: 49
    n_samples: 838
    ancestry_composition:
      EUR: 0.85
      AFR: 0.12
      HISP: 0.02
      OTHER: 0.01
    url: "https://gtexportal.org/home/datasets"
    enabled: true
    priority: 2  # Use but not as primary for diverse populations

  eqtlgen:
    name: "eQTLGen"
    description: "Large blood eQTL meta-analysis (predominantly European)"
    types: [eqtl]
    tissues: [blood]
    n_samples: 31684
    ancestry_composition:
      EUR: 0.95
    url: "https://www.eqtlgen.org/"
    enabled: true
    priority: 3

  ukbiobank_pqtl:
    name: "UK Biobank pQTL"
    description: "Plasma protein QTLs from UK Biobank"
    types: [pqtl]
    tissues: [plasma]
    n_samples: 35559
    ancestry_composition:
      EUR: 0.94
    url: "https://www.ukbiobank.ac.uk/"
    enabled: true
    priority: 3

# -----------------------------------------------------------------------------
# MULTI-ETHNIC / DIVERSE DATASETS
# Prioritized for improved diversity
# -----------------------------------------------------------------------------
multi_ethnic:
  mesa:
    name: "MESA"
    description: "Multi-Ethnic Study of Atherosclerosis - diverse eQTLs"
    types: [eqtl]
    tissues: [monocytes, pbmc]
    n_samples: 1202
    ancestry_composition:
      EUR: 0.38
      AFR: 0.28
      HISP: 0.22
      EAS: 0.12  # Chinese American
    url: "https://www.mesa-nhlbi.org/"
    enabled: true
    priority: 1  # High priority for diverse populations

  page_study:
    name: "PAGE Study"
    description: "Population Architecture using Genomics and Epidemiology"
    types: [eqtl, pqtl]
    tissues: [blood, adipose]
    n_samples: 50000
    ancestry_composition:
      AFR: 0.30
      HISP: 0.35
      ASIAN: 0.15
      NATIVE: 0.10
      EUR: 0.10
    url: "https://www.pagestudy.org/"
    enabled: true
    priority: 1

  topmed_eqtl:
    name: "TOPMed eQTL"
    description: "Trans-Omics for Precision Medicine eQTL data"
    types: [eqtl]
    tissues: [blood, lung, heart]
    n_samples: 15000
    ancestry_composition:
      EUR: 0.50
      AFR: 0.30
      HISP: 0.15
      ASIAN: 0.05
    url: "https://topmed.nhlbi.nih.gov/"
    enabled: true
    priority: 1

  aagre:
    name: "AA GWAS Repository eQTL"
    description: "African American focused GWAS and eQTL repository"
    types: [eqtl]
    tissues: [blood, adipose, liver]
    ancestry_composition:
      AFR: 1.0
    url: "https://www.aagre.org/"
    enabled: true
    priority: 1

# -----------------------------------------------------------------------------
# AFRICAN ANCESTRY SPECIFIC DATASETS
# Critical for African American and African-descent populations
# -----------------------------------------------------------------------------
african_ancestry:
  genoa:
    name: "GENOA"
    description: "Genetic Epidemiology Network of Arteriopathy - AA eQTLs"
    types: [eqtl]
    tissues: [lymphoblastoid_cell_lines]
    n_samples: 800
    ancestry_composition:
      AFR: 1.0
    url: "https://www.genoa-study.org/"
    enabled: true
    priority: 1

  cardia_gene:
    name: "CARDIA Gene Expression"
    description: "Coronary Artery Risk Development in Young Adults - includes AA"
    types: [eqtl]
    tissues: [monocytes, pbmc]
    n_samples: 1264
    ancestry_composition:
      AFR: 0.50
      EUR: 0.50
    url: "https://www.cardia.dopm.uab.edu/"
    enabled: true
    priority: 1

  jackson_heart_study:
    name: "Jackson Heart Study"
    description: "Largest single-site AA cardiovascular cohort"
    types: [eqtl]
    tissues: [blood]
    n_samples: 3000
    ancestry_composition:
      AFR: 1.0
    url: "https://www.jacksonheartstudy.org/"
    enabled: true
    priority: 1

  africa_whi:
    name: "AfricaWHI"
    description: "Women's Health Initiative African American subset"
    types: [eqtl, pqtl]
    tissues: [blood, plasma]
    ancestry_composition:
      AFR: 1.0
    enabled: true
    priority: 1

# -----------------------------------------------------------------------------
# HISPANIC/LATINO ANCESTRY DATASETS
# For Mexican, Central American, South American, Caribbean populations
# -----------------------------------------------------------------------------
hispanic_latino:
  hchs_sol:
    name: "HCHS/SOL"
    description: "Hispanic Community Health Study/Study of Latinos"
    types: [eqtl]
    tissues: [blood]
    n_samples: 16000
    ancestry_composition:
      HISP: 1.0
    subpopulations:
      - mexican
      - cuban
      - puerto_rican
      - dominican
      - central_american
      - south_american
    url: "https://sites.cscc.unc.edu/hchs/"
    enabled: true
    priority: 1

  sigma:
    name: "SIGMA T2D"
    description: "Slim Initiative in Genomic Medicine for the Americas"
    types: [eqtl]
    tissues: [adipose, liver]
    ancestry_composition:
      HISP: 1.0  # Mexican and Latino
    url: "https://www.sigmaproject.org/"
    enabled: true
    priority: 1

  clsa_latino:
    name: "CLSA Latino subset"
    description: "Canadian Longitudinal Study on Aging - Latino subset"
    types: [eqtl]
    tissues: [blood]
    ancestry_composition:
      HISP: 1.0
    enabled: true
    priority: 2

