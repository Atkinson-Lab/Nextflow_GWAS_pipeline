    ancestry_composition:
      EAS: 1.0  # Korean
    enabled: true
    priority: 1

  taiwan_biobank:
    name: "Taiwan Biobank eQTL"
    description: "Taiwanese population eQTLs"
    types: [eqtl]
    tissues: [blood]
    ancestry_composition:
      EAS: 1.0  # Taiwanese/Chinese
    enabled: true
    priority: 1

  chinese_cadre:
    name: "ChinaMAP eQTL"
    description: "China Metabolic Analytics Project"
    types: [eqtl, pqtl]
