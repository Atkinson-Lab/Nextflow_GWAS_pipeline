# =============================================================================
# DATA ACCESS AND DOWNLOAD DOCUMENTATION
# =============================================================================
# This section documents how to access each dataset and whether local download
# is required. The pipeline can use either:
#   1. LOCAL: Pre-downloaded data in assets/qtl_data/
#   2. API: Real-time query via database APIs (xQTLbiolinks, eQTL Catalogue)
#   3. HYBRID: Download only what's needed on-the-fly
#
# For Latino/admixed cohorts, prioritize:
#   - HCHS/SOL (dbGaP controlled) - largest Hispanic omics
#   - TOPMed (dbGaP controlled) - multi-ancestry with Hispanic
#   - Public databases (xQTLatlas, QTLbase2) - aggregated QTLs
# =============================================================================

data_access:
  # -------------------------------------------------------------------------
  # FULLY PUBLIC - NO APPLICATION REQUIRED
  # Can be downloaded directly or queried via API
  # -------------------------------------------------------------------------
  public_download:
    eqtlgen_blood:
      url: "https://www.eqtlgen.org/cis-eqtls.html"
      format: "txt.gz"
      size: "~15GB"
      download_required: true
      note: "Download cis-eQTL and trans-eQTL files"

    gtex_v8:
      url: "https://gtexportal.org/home/downloads/adult-gtex/qtl"
      format: "txt.gz per tissue"
      size: "~50GB total"
      download_required: true
      note: "Select blood tissues: Whole_Blood, Cells_EBV-transformed_lymphocytes"

    godmc:
      url: "http://mqtldb.godmc.org.uk/downloads"
      format: "txt.gz"
      size: "~5GB"
      download_required: true

    dice_immune:
      url: "https://dice-database.org/download"
      format: "txt"
      download_required: true
      note: "Download per cell type"

    pancanqtl_v2:
      url: "https://hanlaboratory.com/PancanQTLv2/"
      format: "txt.gz"
      download_required: true
      note: "Download cancer-specific or use web interface"

    pharmgkb:
      url: "https://www.pharmgkb.org/downloads"
      format: "tsv"
      download_required: true
      note: "Clinical annotations and variant annotations files"

  # -------------------------------------------------------------------------
  # PUBLIC DATABASES - API ACCESS AVAILABLE
  # Can query without downloading full dataset
  # -------------------------------------------------------------------------
  public_api:
    xqtlatlas:
      url: "http://www.hitxqtl.org.cn/"
      api: true
      download_required: false
      note: "Web interface for querying; no bulk download needed"

    qtlbase2:
      url: "http://mulinlab.org/qtlbase"
      api: true
      download_required: false
      note: "Query by variant/gene; includes drug treatment QTLs"

    eqtl_catalogue:
      url: "https://www.ebi.ac.uk/eqtl/api-docs/"
      api: true
      download_required: false
      note: "REST API available; uniformly processed data"
      api_example: "curl -X GET 'https://www.ebi.ac.uk/eqtl/api/genes/ENSG00000141510'"

    xqtlbiolinks:
      url: "https://github.com/dingruofan/xQTLbiolinks"
      api: "R package"
      download_required: false
      note: "R package queries GTEx, DICE, eQTLGen automatically"
      install: "devtools::install_github('dingruofan/xQTLbiolinks')"

  # -------------------------------------------------------------------------
  # CONTROLLED ACCESS - APPLICATION REQUIRED
  # Requires dbGaP or EGA application (2-4 weeks typical)
  # -------------------------------------------------------------------------
  controlled_dbgap:
    hchs_sol_multi_omics:
      dbgap_id: "phs000810.v2.p2"
      url: "https://www.ncbi.nlm.nih.gov/projects/gap/cgi-bin/study.cgi?study_id=phs000810"
      application_time: "2-4 weeks"
      download_required: true
      data_types:
        - whole_blood_rnaseq  # 7,700 samples
        - methylation         # 12,000 samples
        - proteomics          # 2,000 samples
        - metabolomics        # 12,000 samples
      note: "CRITICAL for Latino leukemia - largest Hispanic omics dataset"

    topmed_multi_ancestry:
      dbgap_id: "Multiple phs IDs"
      url: "https://topmed.nhlbi.nih.gov/"
      application_time: "2-4 weeks"
      download_required: true
      note: "Apply via dbGaP; TOPMed Freeze 9+ has RNA-seq"

    mesa_multi_omics:
      dbgap_id: "phs001416"
      url: "https://www.mesa-nhlbi.org/"
      application_time: "2-4 weeks"
      download_required: true
      note: "Multi-ethnic with pQTL and eQTL; part of TOPMed"

    genoa_eqtl:
      dbgap_id: "phs000379"
      url: "https://www.ncbi.nlm.nih.gov/projects/gap/cgi-bin/study.cgi?study_id=phs000379"
      application_time: "2-4 weeks"
      download_required: true
      note: "African American LCL eQTL and mQTL"

    blueprint_blood:
      ega_id: ["EGAD00001005199", "EGAD00001005200"]
      url: "https://ega-archive.org/"
      application_time: "2-4 weeks"
      download_required: true
      note: "European blood cell eQTL/mQTL/hQTL; apply via EGA"

  # -------------------------------------------------------------------------
  # CONTACT PI / COLLABORATIVE ACCESS
  # Requires direct contact with study investigators
  # -------------------------------------------------------------------------
  contact_required:
    gala_sage_eqtl:
      pi: "Esteban Burchard"
      institution: "UCSF"
      url: "https://pharm.ucsf.edu/burchard/research/study-populations"
      note: "Latino (GALA II) and African American (SAGE II) asthma cohorts"

    mexican_biobank:
      contact: "See Nature 2023 publication"
      url: "https://www.nature.com/articles/s41586-023-06560-0"
      note: "68 indigenous groups; imputation reference panel"

    onek1k_pbmc:
      url: "https://onek1k.org/"
      note: "Some data public via GEO; full access via collaboration"

# =============================================================================
# RECOMMENDED DOWNLOAD PRIORITY FOR LATINO LEUKEMIA COHORT
# =============================================================================
# REALITY CHECK: Most Latino-specific QTL data requires dbGaP access.
# This strategy focuses on PUBLIC resources that can be used immediately.
#
# =============================================================================
# PUBLIC-ONLY STRATEGY (NO dbGaP REQUIRED)
# =============================================================================
#
# STEP 1: CRITICAL DOWNLOADS (public, no application)
#   1. SuShiE Zenodo - ONLY PUBLIC LATINO RESOURCE
#      URL: https://doi.org/10.5281/zenodo.10963033
#      Contains: MESA Hispanic (n=352) fine-mapping, TWAS/PWAS weights
#   2. eQTLGen blood eQTL (~15GB) - largest blood eQTL
#   3. GTEx v8 blood (Whole_Blood, Cells_EBV-LCL)
#   4. DICE immune cell eQTL - cell-type specific
#   5. PancanQTLv2 - cancer eQTL + drug response associations
#   6. PharmGKB - pharmacogenomics annotations
#   7. GoDMC mQTL - methylation QTL
#
# STEP 2: API-BASED TOOLS (query without bulk download)
#   1. xQTLbiolinks R package
#      Install: devtools::install_github('dingruofan/xQTLbiolinks')
#      Queries: GTEx, eQTLGen, DICE automatically
#   2. eQTL Catalogue API (https://www.ebi.ac.uk/eqtl/api-docs/)
#   3. xQTLatlas web (http://www.hitxqtl.org.cn/) - 151 cell types
#   4. QTLbase2 web (http://mulinlab.org/qtlbase) - drug treatment QTLs
#
# STEP 3: COLOCALIZATION STRATEGY FOR LATINO WITHOUT LATINO eQTL
#   Problem: No large public Latino eQTL summary stats exist
#   Solution:
#   a) Use SuShiE Hispanic weights for TWAS/fine-mapping
#   b) Use EUR eQTL (eQTLGen/GTEx) for discovery
#   c) Query xQTLatlas/QTLbase2 for cross-ancestry consistency
#   d) Prioritize SHARED signals (consistent across ancestries)
#   e) Flag DIVERGENT signals - may be ancestry-specific, need validation
#   f) For divergent loci: check if in LD with Latino-specific variants
#
# INTERPRETATION CAVEATS (document in results):
#   - Colocalization with EUR eQTL may miss Latino-specific regulatory variants
#   - LD patterns differ between EUR and admixed Latino populations
#   - Use SuShiE cross-ancestry weights to partially address this
#   - Consider ancestry-specific fine-mapping with CARMA-X if individual data available
#
# =============================================================================
# OPTIONAL: dbGaP ACCESS (only if absolutely necessary)
# =============================================================================
# These require 2-4 week application process:
#   - HCHS/SOL (phs000810) - no public summary stats, individual-level only
#   - TOPMed GSR (phs001974) - only low p-values public, full stats controlled
#   - MESA (phs001416) - multi-ethnic pQTL/eQTL individual data
# =============================================================================

download_paths:
  # Where to store downloaded QTL data
  base_dir: "assets/qtl_data"
  eqtl_dir: "assets/qtl_data/eqtl"
  mqtl_dir: "assets/qtl_data/mqtl"
  pqtl_dir: "assets/qtl_data/pqtl"
  caqtl_dir: "assets/qtl_data/caqtl"
  annotations_dir: "assets/annotations"

  # Controlled access data (user provides path after dbGaP download)
  controlled_data_dir: null  # Set to path after downloading controlled data
