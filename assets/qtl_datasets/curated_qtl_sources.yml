# -----------------------------------------------------------------------------
# SOUTH ASIAN ANCESTRY DATASETS
# -----------------------------------------------------------------------------
south_asian:
  lolipop:
    name: "LOLIPOP"
    description: "London Life Sciences Prospective Population Study"
    types: [eqtl]
    tissues: [blood]
    n_samples: 5000
    ancestry_composition:
      SAS: 1.0  # Indian Asian
    url: "https://www.lolipopstudy.org/"
    enabled: true
    priority: 1

  india_genome_variation:
    name: "IndiGen"
    description: "Indian Genome Variation Consortium eQTLs"
    types: [eqtl]
    tissues: [blood]
    ancestry_composition:
      SAS: 1.0
    enabled: true
    priority: 1

# -----------------------------------------------------------------------------
# TISSUE-SPECIFIC DATASETS (Multi-ethnic when available)
# -----------------------------------------------------------------------------
tissue_specific:
  psychencode:
    name: "PsychENCODE"
    description: "Brain-specific expression QTLs"
    types: [eqtl, sqtl]
    tissues: [brain_cortex, brain_cerebellum, brain_hippocampus]
    n_samples: 2000
    ancestry_composition:
      EUR: 0.75
      AFR: 0.15
      OTHER: 0.10
    url: "https://www.psychencode.org/"
    enabled: true
    priority: 2

  commonmind:
    name: "CommonMind"
    description: "Brain eQTLs from multiple psychiatric cohorts"
    types: [eqtl]
    tissues: [brain_dlpfc]
    n_samples: 600
    ancestry_composition:
      EUR: 0.70
      AFR: 0.20
      OTHER: 0.10
    url: "https://www.synapse.org/cmc"
    enabled: true
    priority: 2

  encode_kidney:
    name: "ENCODE Kidney QTL"
    description: "Kidney-specific regulatory QTLs"
    types: [eqtl, caqtl]
    tissues: [kidney]
    enabled: true
    priority: 2

# -----------------------------------------------------------------------------
# POOLING STRATEGY BY TARGET ANCESTRY
# Defines which datasets to pool for colocalization by ancestry group
# -----------------------------------------------------------------------------
pooling_strategy:
  EUR:
    primary: [gtex_v8, eqtlgen, ukbiobank_pqtl]
    secondary: [mesa, page_study, topmed_eqtl]

  AFR:
    primary: [genoa, jackson_heart_study, cardia_gene, aagre, africa_whi]
    secondary: [mesa, page_study, topmed_eqtl, gtex_v8]
    note: "Prioritize AFR-specific datasets due to LD differences"

  AAC:  # African American (admixed)
    primary: [genoa, jackson_heart_study, cardia_gene, aagre]
    secondary: [mesa, page_study, topmed_eqtl]
    tractor_compatible: true
    ancestral_components: [EUR, AFR]

  EAS:
    primary: [bbj_eqtl, korea_biobank, taiwan_biobank, chinese_cadre]
    secondary: [mesa, topmed_eqtl]

  SAS:
    primary: [lolipop, india_genome_variation]
    secondary: [page_study, topmed_eqtl]

  AMR:  # Native American component
    primary: [page_study]
    secondary: [hchs_sol, mesa]
    note: "Limited data - use admixed Latino studies"

  HISP:  # Hispanic/Latino
    primary: [hchs_sol, sigma, mesa]
    secondary: [page_study, topmed_eqtl]

  LAT1:  # Latino Type 1 (Mexican/Central American - higher NAT)
    primary: [hchs_sol, sigma]
    secondary: [mesa, page_study]
    tractor_compatible: true
    ancestral_components: [EUR, NAT, AFR]

  LAT2:  # Latino Type 2 (Caribbean/South American - higher AFR)
    primary: [hchs_sol]
    secondary: [mesa, page_study, genoa]
    tractor_compatible: true
    ancestral_components: [EUR, NAT, AFR]

  MID:  # Middle Eastern
    primary: [page_study]
    secondary: [mesa, topmed_eqtl]
    note: "Limited specific data available"

  HET:  # Heterogeneous/Other
    primary: [mesa, page_study, topmed_eqtl]
    secondary: [gtex_v8]
    note: "Use most diverse multi-ethnic sources"

