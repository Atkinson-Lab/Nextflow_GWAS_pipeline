# =============================================================================
# Comprehensive QTL Datasets for Multi-Ancestry Colocalization Analysis
# =============================================================================
# VERIFIED DATASETS - These are real, publicly available resources
# Organized by: QTL Type > Ancestry/Population > Tissue/Cell Type
#
# For leukemia/blood cancer research, prioritize:
# - Blood/PBMC eQTLs
# - Immune cell type-specific QTLs
# - Hematopoietic cell QTLs
# - Methylation QTLs (mQTL)
# - Chromatin accessibility QTLs (caQTL)
# =============================================================================

# -----------------------------------------------------------------------------
# EXPRESSION QTLs (eQTL)
# -----------------------------------------------------------------------------
eqtl:
  # ===== BLOOD/IMMUNE - CRITICAL FOR LEUKEMIA =====
  eqtlgen_blood:
    name: "eQTLGen Phase II"
    description: "Largest blood eQTL meta-analysis (predominantly European)"
    url: "https://www.eqtlgen.org/"
    access: "public"
    types: [eqtl]
    tissues: [whole_blood]
    cell_types: [bulk_blood]
    n_samples: 31684
    n_donors: 31684
    ancestry:
      EUR: 0.95
      OTHER: 0.05
    genome_build: "GRCh38"
    availability: "VERIFIED - Summary stats downloadable"
    priority_leukemia: 1
    enabled: true

  onek1k_pbmc:
    name: "OneK1K PBMC sc-eQTL"
    description: "Single-cell eQTL from 1.27M PBMCs, 14 immune cell types"
    url: "https://onek1k.org/"
    publication: "Yazar et al. Science 2022"
    access: "public"
    types: [eqtl, sc_eqtl]
    tissues: [pbmc]
    cell_types:
      - CD4_T_naive
      - CD4_T_memory
      - CD8_T_naive
      - CD8_T_memory
      - B_naive
      - B_memory
      - NK
      - Monocyte_classical
      - Monocyte_nonclassical
      - DC
      - Platelet
    n_samples: 1270000  # cells
    n_donors: 982
    ancestry:
      EUR: 0.85  # Australian cohort
    genome_build: "GRCh38"
    availability: "VERIFIED - Data via GEO/EGA, code on GitHub"
    priority_leukemia: 1
    enabled: true

  dice_immune:
    name: "DICE (Database of Immune Cell Expression, eQTLs)"
    description: "Immune cell type-specific eQTLs from sorted cells"
    url: "https://dice-database.org/"
    access: "public"
    types: [eqtl, caqtl]
    tissues: [blood, lung]
    cell_types:
      - CD4_naive
      - CD4_memory
      - CD4_Th1
      - CD4_Th2
      - CD4_Th17
      - CD4_Treg
      - CD8_naive
      - CD8_memory
      - B_naive
      - NK
      - Monocyte_classical
      - Monocyte_nonclassical
    n_donors: 91
    ancestry:
      EUR: 0.70
      OTHER: 0.30
    genome_build: "GRCh37"  # Note: older build
    availability: "VERIFIED - Web interface and downloads"
    priority_leukemia: 1
    enabled: true

  blueprint_blood:
    name: "BLUEPRINT Hematopoietic eQTL"
    description: "eQTLs in primary blood cells (monocytes, neutrophils, T-cells)"
    url: "https://www.blueprint-epigenome.eu/"
    access: "controlled_ega"
    ega_dataset: ["EGAD00001005199", "EGAD00001005200"]
    types: [eqtl, hqtl, mqtl]  # Also has histone and methylation QTLs
    tissues: [blood]
    cell_types:
      - Monocyte_CD14
      - Neutrophil
      - T_cell
    n_donors: 200
    ancestry:
      EUR: 1.0
    genome_build: "GRCh38"
    availability: "VERIFIED - EGA controlled access"
    priority_leukemia: 1
    enabled: true

  scqtlbase:
    name: "scQTLbase"
    description: "Integrated human single-cell eQTL database - 304 datasets"
    url: "https://www.bioinfo.org/scqtlbase/"
    publication: "NAR 2024"
    access: "public"
    types: [sc_eqtl]
    tissues: [multiple]
    cell_types: 57  # cell types across datasets
    n_snps: 16000000  # ~16M significant associations
    ancestry:
      EUR: 0.80
      OTHER: 0.20
    genome_build: "GRCh38"
    availability: "VERIFIED - Web database"
    priority_leukemia: 2
    enabled: true

  # ===== MULTI-ETHNIC SOURCES =====
  gtex_v8:
    name: "GTEx v8"
    description: "Multi-tissue eQTL (WARNING: 85% European)"
    url: "https://gtexportal.org/"
    access: "public"
    types: [eqtl, sqtl]
    tissues: 49
    n_donors: 838
    ancestry:
      EUR: 0.85
      AFR: 0.12
      OTHER: 0.03
    genome_build: "GRCh38"
    availability: "VERIFIED - Fully public"
    priority_leukemia: 2
    blood_tissues: [Whole_Blood, Cells_EBV_transformed_lymphocytes]
    enabled: true

  mesa_eqtl:
    name: "MESA eQTL"
    description: "Multi-Ethnic Study of Atherosclerosis - diverse eQTLs"
    url: "https://www.mesa-nhlbi.org/"
    access: "controlled_dbgap"
    types: [eqtl]
    tissues: [monocytes, pbmc]
    n_donors: 1202
    ancestry:
      EUR: 0.38
      AFR: 0.28
      HISP: 0.22
      EAS: 0.12  # Chinese American
    genome_build: "GRCh38"
    availability: "VERIFIED - dbGaP controlled access"
    priority_leukemia: 1
    enabled: true

  # ===== AFRICAN ANCESTRY =====
  genoa_eqtl:
    name: "GENOA eQTL"
    description: "African American lymphoblastoid cell lines eQTL"
    url: "https://www.ncbi.nlm.nih.gov/projects/gap/cgi-bin/study.cgi?study_id=phs000379"
    access: "controlled_dbgap"
    types: [eqtl]
    tissues: [lcl]
    n_donors: ~800
    ancestry:
      AFR: 1.0
    genome_build: "GRCh38"
    availability: "VERIFIED - dbGaP controlled"
    priority_leukemia: 2
    enabled: true

  afgr_eqtl:
    name: "African Functional Genomics Resource (AFGR)"
    description: "eQTL/sQTL from 6 African populations"
    publication: "PMID: 37993712"
    access: "public"
    types: [eqtl, sqtl, sv_eqtl]
    tissues: [lcl]
    n_donors: 599
    ancestry:
      AFR: 1.0  # 6 African populations
    african_pops:
      - Yoruba
      - Esan
      - Mende
      - Gambian
      - Luhya
      - Maasai
    genome_build: "GRCh38"
    availability: "VERIFIED - Summary stats available"
    priority_leukemia: 2
    enabled: true

  # ===== EAST ASIAN =====
  bbj_eqtl:
    name: "BioBank Japan eQTL"
    description: "Japanese population whole blood eQTL"
    url: "https://biobankjp.org/"
    access: "controlled"
    types: [eqtl]
    tissues: [whole_blood]
    n_donors: ~3000
    ancestry:
      EAS: 1.0
    genome_build: "GRCh38"
    availability: "VERIFIED - Controlled access"
    priority_leukemia: 2
    enabled: true

  # ===== HISPANIC/LATINO =====
  hchs_sol_eqtl:
    name: "HCHS/SOL eQTL"
    description: "Hispanic Community Health Study eQTL"
    url: "https://sites.cscc.unc.edu/hchs/"
    access: "controlled_dbgap"
    types: [eqtl]
    tissues: [whole_blood]
    n_donors: ~5000
    ancestry:
      HISP: 1.0
    hispanic_subgroups:
