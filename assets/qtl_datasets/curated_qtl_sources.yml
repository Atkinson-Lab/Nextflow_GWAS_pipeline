    description: "Scalable multi-ancestry fine-mapping with shared/specific signals"
    publication: "Nat Genet 2024"
    url: "https://www.nature.com/articles/s41588-023-01604-7"
    access: "public"
    types: [fine_mapping]
    features:
      - summary_stats_based
      - ancestry_specific_ld
      - shared_causal_snps
      - ancestry_specific_causal_snps
    genome_build: "GRCh38"
    availability: "VERIFIED - Software available"
    priority_latino: 1
    enabled: true

  carmax_admixed:
    name: "CARMA-X Admixed Fine-Mapping"
    description: "Fine-mapping in admixed populations using local ancestry"
    publication: "AJHG 2025"
    url: "https://www.sciencedirect.com/science/article/abs/pii/S0002929725000953"
    access: "public"
    types: [fine_mapping]
    features:
      - local_ancestry_modeling
      - admixed_population_optimized
      - reduced_false_discovery
    genome_build: "GRCh38"
    availability: "VERIFIED - Software available"
    priority_latino: 1
    note: "Specifically designed for Latino/admixed populations"
    enabled: true

# -----------------------------------------------------------------------------
# STUDY-TYPE PRESETS
# Recommended QTL datasets by study focus
# -----------------------------------------------------------------------------
study_type_presets:
  blood:
    description: "Blood/hematologic traits (e.g., blood cell counts, coagulation)"
    primary: [eqtlgen_blood, onek1k_pbmc, dice_immune, blueprint_blood]
    secondary: [mesa_eqtl, genoa_eqtl, godmc]
    cell_types: [whole_blood, pbmc, monocyte, T_cell, B_cell, NK, neutrophil]

  immune:
    description: "Immune/inflammatory traits (e.g., autoimmune diseases, immune response)"
    primary: [onek1k_pbmc, dice_immune, blueprint_blood, eqtlgen_blood]
    secondary: [scqtlbase, hca_immune_atlas]
    cell_types: [T_cell, B_cell, monocyte, DC, NK, macrophage]

  psych:
    description: "Neuropsychiatric traits (e.g., schizophrenia, bipolar, depression)"
    primary: [psychencode_eqtl, gtex_brain, metabrain_eqtl, brainseq_eqtl]
    secondary: [cmc_brain_eqtl, brain_caqtl]
    tissues: [brain, prefrontal_cortex, hippocampus, amygdala]

  cardio:
    description: "Cardiovascular traits (e.g., CAD, blood pressure, heart failure)"
    primary: [gtex_heart, gtex_artery, eqtlgen_blood]
    secondary: [mesa_eqtl]
    tissues: [heart, artery, blood]

  cancer:
    description: "Cancer/oncology traits"
    primary: [pancanqtl_v2, cancer_immunity_qtl]
    secondary: [gtex_v8]
    note: "Use tumor-specific tissues when available"

  metabolic:
    description: "Metabolic traits (e.g., T2D, obesity, lipids)"
    primary: [gtex_liver, gtex_adipose, gtex_pancreas]
    secondary: [eqtlgen_blood, mesa_eqtl]
    tissues: [liver, adipose, pancreas, muscle]

  autoimmune:
    description: "Autoimmune diseases (e.g., RA, lupus, MS)"
    primary: [dice_immune, onek1k_pbmc, blueprint_blood]
    secondary: [eqtlgen_blood, hca_immune_atlas]
    cell_types: [T_cell, B_cell, monocyte]

  leukemia:
    description: "Leukemia/blood cancer"
    primary: [onek1k_pbmc, dice_immune, blueprint_blood, pancanqtl_v2]
    secondary: [eqtlgen_blood, cancer_immunity_qtl, hca_immune_atlas]
    cell_types: [HSPC, T_cell, B_cell, monocyte]

  leukemia_latino:
    description: "Leukemia/blood cancer in Hispanic/Latino populations (PUBLIC RESOURCES)"
    # PUBLIC (no dbGaP):
    public_primary: [sushie_mesa_zenodo, onek1k_pbmc, dice_immune, eqtlgen_blood]
    public_secondary: [pancanqtl_v2, gtex_v8, godmc]
    api_databases: [xqtlatlas, qtlbase2, eqtl_catalogue, xqtlbiolinks]
    fine_mapping: [sushie_mesa_zenodo, carmax_admixed, mesusie_resources]
    pharmacogenomics: [pancanqtl_drug_response, pharmgkb_annotations, qtlbase2_drug_treatment]
    cell_types: [HSPC, T_cell, B_cell, monocyte, pbmc]
    # CONTROLLED ACCESS (only if absolutely necessary):
    dbgap_if_needed: [hchs_sol_multi_omics, topmed_multi_ancestry]
    strategy: |
      1. Download SuShiE Zenodo (MESA Hispanic n=352 fine-mapping weights)
      2. Use EUR eQTL (eQTLGen/GTEx/DICE) for colocalization discovery
      3. Apply SuShiE Hispanic weights for TWAS/fine-mapping
      4. Query xQTLatlas/QTLbase2 for cross-ancestry validation
      5. Flag DIVERGENT signals (EUR-only coloc) for Latino-specific validation
      6. Use PancanQTL for drug response associations
      CAVEAT: Limited Latino-specific eQTL - interpret with caution

# -----------------------------------------------------------------------------
# POOLING STRATEGY FOR LEUKEMIA COHORT
# Priority 1 = Use first, Priority 2 = Supplement
# -----------------------------------------------------------------------------
pooling_strategy:
  # For leukemia: prioritize blood, immune, hematopoietic
  leukemia_recommended:
    eqtl:
      priority_1: [onek1k_pbmc, dice_immune, blueprint_blood, eqtlgen_blood, mesa_eqtl]
      priority_2: [gtex_v8, genoa_eqtl, afgr_eqtl, bbj_eqtl]
    mqtl:
      priority_1: [genoa_mqtl, blueprint_mqtl, godmc]
      priority_2: [gtex_mqtl, eas_blood_mqtl]
    caqtl:
      priority_1: [dice_caqtl, blueprint_hqtl, snATAC_pbmc]
      priority_2: [afgr_caqtl, diverse_pop_caqtl]
    sc_qtl:
      priority_1: [onek1k_full, hca_immune_atlas]
      priority_2: [scqtlbase, broad_immune_atlas]

  # By GWAS ancestry
  EUR:
    primary: [eqtlgen_blood, onek1k_pbmc, dice_immune, blueprint_blood, godmc]
    secondary: [gtex_v8]

  AFR:
    primary: [genoa_eqtl, genoa_mqtl, afgr_eqtl, afgr_caqtl, afgr_sqtl]
    secondary: [mesa_eqtl, onek1k_pbmc]
    note: "Prioritize AFR-specific due to LD differences"

  AAC:  # African American
    primary: [genoa_eqtl, genoa_mqtl, mesa_eqtl]
    secondary: [afgr_eqtl, onek1k_pbmc, dice_immune]
    note: "Use both AFR and EUR sources for admixed"

  HISP:  # Hispanic/Latino combined
    # PUBLIC RESOURCES (no dbGaP required):
    public_primary: [sushie_mesa_zenodo, eqtlgen_blood, gtex_v8, dice_immune]
    public_secondary: [godmc, pancanqtl_v2]
    api_databases: [xqtlatlas, qtlbase2, eqtl_catalogue, xqtlbiolinks]
    fine_mapping: [sushie_mesa_zenodo, carmax_admixed, mesusie_resources]
    pharmacogenomics: [pancanqtl_drug_response, pharmgkb_annotations]
    # CONTROLLED ACCESS (dbGaP required - use only if necessary):
    dbgap_if_needed: [hchs_sol_multi_omics, topmed_multi_ancestry, mesa_multi_omics]
    note: |
      PUBLIC STRATEGY: SuShiE Zenodo is ONLY public Latino resource (MESA HIS n=352).
      Use EUR eQTL (eQTLGen/GTEx) for discovery, flag divergent signals.
      Query xQTLatlas/QTLbase2 APIs for cross-ancestry validation.
      Most Hispanic-specific data requires dbGaP (HCHS/SOL, TOPMed).

  EAS:
    primary: [bbj_eqtl, eas_blood_mqtl, aida_sqtl]
    secondary: [mesa_eqtl, onek1k_pbmc]

